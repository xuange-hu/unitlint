[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitlint"
version = "0.1.1"
description = "Audit systemd units the way systemd assembles them: search-path priority, drop-in overrides, binary provenance. 44 deterministic rules, zero dependencies, SARIF for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# Dependency-free on purpose: this has to run inside a container image build,
# on a rescue shell, and on the host it is auditing -- none of which is a good
# place to install a YAML stack.
dependencies = []
keywords = [
  "systemd",
  "security",
  "audit",
  "hardening",
  "linux",
  "unit-files",
  "drop-in",
  "static-analysis",
  "sarif",
  "devsecops",
  "linter",
  "container-image",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and moved the import path; this server
# targets the 1.x line only.
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/xuange-hu/unitlint"
Repository = "https://github.com/xuange-hu/unitlint"
Issues = "https://github.com/xuange-hu/unitlint/issues"
Changelog = "https://github.com/xuange-hu/unitlint/blob/main/CHANGELOG.md"

[project.scripts]
unitlint = "unitlint.cli:main"
unitlint-mcp = "unitlint.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unitlint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
