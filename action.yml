name: unitlint - systemd unit security audit
description: >-
  Audit systemd units the way systemd assembles them: search-path priority,
  drop-in overrides and byte-offset provenance. Installs from this action's
  own checkout, so no PyPI release is required.
author: xuange-hu

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: File, unit directory, or mounted root filesystem to audit.
    required: false
    default: "."
  unit:
    description: Audit only this unit name, e.g. web-api.service. Empty means all.
    required: false
    default: ""
  fail-on:
    description: Exit 1 at or above this severity (none, note, low, medium, high, critical).
    required: false
    default: "high"
  sarif:
    description: Write SARIF 2.1.0 instead of the text report, ready for code-scanning upload.
    required: false
    default: "false"

outputs:
  report:
    description: Path to the generated report file.
    value: ${{ steps.audit.outputs.report }}
  verdict:
    description: PASS or FAIL at the configured fail-on threshold.
    value: ${{ steps.audit.outputs.verdict }}
  exit-code:
    description: The scan's exit code.
    value: ${{ steps.audit.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install unitlint from this action's checkout
      shell: bash
      env:
        UL_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet "$UL_ACTION_PATH"

    # Inputs travel through the environment, never interpolated into shell
    # text: a path containing shell metacharacters must not become code.
    - name: Audit
      id: audit
      shell: bash
      env:
        UL_PATH: ${{ inputs.path }}
        UL_UNIT: ${{ inputs.unit }}
        UL_FAIL_ON: ${{ inputs.fail-on }}
        UL_SARIF: ${{ inputs.sarif }}
        UL_SKIP_INSTALL: "1"
      run: bash "${{ github.action_path }}/scripts/unitlint-action.sh"
